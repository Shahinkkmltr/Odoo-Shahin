<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Business Suite</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f9fafb;--panel:#fff;--ink:#212529;--muted:#6c757d;--line:#dee2e6;--pri:#714b67;--prih:#5f3e56;--nav:#714b67;--link:#017e84;--sel:#f3ecf1;--ok:#198754;--bad:#dc3545;--warn:#e8890c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a1f;--panel:#25232b;--ink:#e8e6ec;--muted:#a09cab;--line:#3a3743;--pri:#9a6a8d;--prih:#b17fa3;--nav:#4a3344;--link:#4cc3c9;--sel:#332c37;--ok:#4cc58a;--bad:#ff7d8a;--warn:#f0a94b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1a1f;--panel:#25232b;--ink:#e8e6ec;--muted:#a09cab;--line:#3a3743;--pri:#9a6a8d;--prih:#b17fa3;--nav:#4a3344;--link:#4cc3c9;--sel:#332c37;--ok:#4cc58a;--bad:#ff7d8a;--warn:#f0a94b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Roboto,system-ui,sans-serif}
#nav{background:var(--nav);color:#fff;display:flex;align-items:center;height:46px;padding:0 10px;gap:2px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;overflow:visible}
.brand{font-weight:500;font-size:15px;margin:0 14px 0 4px;display:flex;align-items:center;gap:8px}.brand i{font-style:normal;font-size:18px}
.dd{position:relative}.dd>button,.dd>a{background:none;border:0;color:#fff;font:inherit;padding:0 12px;height:46px;cursor:pointer;opacity:.85}
.dd>button:hover,.dd.on>button{background:rgba(255,255,255,.12);opacity:1}
.dm{display:none;position:absolute;left:0;top:46px;min-width:190px;background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:0 6px 16px rgba(0,0,0,.18);padding:4px 0}
.dd:hover .dm,.dd:focus-within .dm{display:block}.dm a{display:block;padding:8px 16px;cursor:pointer}.dm a:hover{background:var(--sel)}
.av{margin-left:auto;width:28px;height:28px;border-radius:50%;background:#fff;color:var(--pri);display:grid;place-items:center;font-weight:700}
.cp{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.bc{font-size:18px;display:flex;gap:6px;align-items:center}.bc a{color:var(--link);cursor:pointer}.bc span{color:var(--muted)}
.search{flex:1;min-width:200px;max-width:420px;display:flex;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
.search input{flex:1;border:0;background:none;padding:6px 10px;color:var(--ink);font:inherit;min-width:0}.search select{border:0;border-left:1px solid var(--line);background:none;color:var(--ink);font:inherit;padding:0 6px}
.btn{background:var(--pri);color:#fff;border:1px solid var(--pri);border-radius:4px;padding:6px 12px;font:500 14px Roboto,sans-serif;cursor:pointer}.btn:hover{background:var(--prih)}
.btn.s{background:var(--panel);color:var(--ink);border-color:var(--line)}.btn.s:hover{background:var(--sel)}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--link);outline-offset:1px}
main{padding:16px;max-width:1280px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;display:flex;flex-direction:column}
.ch{padding:10px 14px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line)}.ch b{font-size:15px;font-weight:500}.ch small{color:var(--muted)}
.cb{padding:12px 14px;display:flex;gap:14px;justify-content:space-between;align-items:stretch;flex:1}
.lk{display:flex;flex-direction:column;gap:5px;align-items:flex-start;min-width:0}
.lk a{color:var(--link);cursor:pointer;display:flex;gap:14px;justify-content:space-between;width:100%;font-variant-numeric:tabular-nums}.lk a:hover{text-decoration:underline}
.bars{display:flex;gap:8px;align-items:flex-end;height:78px;padding-top:6px}.bars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-size:11px;color:var(--muted);height:100%;width:46px}.bars i{display:block;width:26px;background:var(--pri);border-radius:2px 2px 0 0;min-height:3px;opacity:.85}.bars i.l{background:var(--bad)}
.big{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.sec{margin:18px 0 8px;font-size:15px;font-weight:500}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{padding:7px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:500;color:var(--ink);background:var(--bg);font-size:13px}td.n,th.n{text-align:right}
tbody tr.row{cursor:pointer}tbody tr.row:hover{background:var(--sel)}tr.t td{font-weight:500;background:var(--bg)}
.bd{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:500;background:var(--line);color:var(--ink)}
.bd.p{background:rgba(232,137,12,.18);color:var(--warn)}.bd.g{background:rgba(25,135,84,.18);color:var(--ok)}.bd.d{background:var(--line);color:var(--muted)}
.late{color:var(--bad)}.pos{color:var(--ok)}.neg{color:var(--bad)}
.sb{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);gap:8px;flex-wrap:wrap}
.st{display:flex}.st span{padding:4px 16px 4px 22px;background:var(--line);color:var(--muted);font-size:13px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,0 100%,10px 50%);margin-left:-6px}.st span.on{background:var(--pri);color:#fff}
.form{background:var(--panel);border:1px solid var(--line);border-radius:4px;margin:16px;padding:20px;position:relative;overflow:hidden}
.form h1{margin:0 0 16px;font-size:26px;font-weight:500}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px 36px;margin-bottom:16px}
.fl{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:6px}.fl label{font-weight:500}
input,select{font:inherit;color:var(--ink);background:var(--panel);border:0;border-bottom:1px solid var(--line);padding:4px 2px;min-width:0;width:100%}input:disabled,select:disabled{border-color:transparent;background:none;opacity:1;-webkit-text-fill-color:var(--ink)}
.tabs{border-bottom:1px solid var(--line);display:flex;gap:2px;margin-bottom:8px}.tabs a{padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted)}.tabs a.on{color:var(--ink);border-color:var(--pri);font-weight:500}
.tot{margin-left:auto;width:min(300px,100%);margin-top:12px}.tot div{display:flex;justify-content:space-between;padding:4px 0}.tot .g{font-weight:700;border-top:1px solid var(--ink);margin-top:4px;padding-top:6px}
.ribbon{position:absolute;top:22px;right:-38px;transform:rotate(45deg);background:var(--ok);color:#fff;padding:4px 44px;font-weight:700;letter-spacing:.5px}
.empty{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:700px){#nav .dd>button{padding:0 8px}.brand span{display:none}}
body.home{background:linear-gradient(135deg,#8c7b87 0%,#a38f96 60%,#b39da1 100%);min-height:100vh}
body.home #nav{background:rgba(0,0,0,.28)}
.apps{display:grid;grid-template-columns:repeat(6,110px);gap:30px 36px;justify-content:center;max-width:900px;margin:56px auto;padding:0 16px}
button.app{display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;cursor:pointer;text-align:center;font:14px Roboto,sans-serif;background:none;border:0;padding:0}
.tile{width:70px;height:70px;border-radius:5px;background:var(--c);display:grid;place-items:center;position:relative;overflow:hidden;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .15s}
.tile:before{content:"";position:absolute;inset:0;background:linear-gradient(45deg,rgba(0,0,0,.24) 50%,transparent 50%)}
.tile svg{position:relative;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.2))}
.app:hover .tile,.app:focus-visible .tile{transform:translateY(-3px)}
.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}.kp .card{padding:10px 14px}.kp small{color:var(--muted)}
@media(max-width:760px){.apps{grid-template-columns:repeat(3,1fr);gap:26px 8px}}
</style></head><body>
<div id="nav"></div><div id="cp"></div><div id="main"></div>
<script>
const CUR='SAR',MENU=[['Customers',[['Invoices','list-out']]],['Vendors',[['Bills','list-in']]],['Accounting',[['Journal Entries','je']]],['Reporting',[['Trial Balance','tb'],['Profit & Loss','pl'],['Balance Sheet','bs']]],['Configuration',[['Chart of Accounts','coa']]]];
const TY={asset:'Current Assets',liability:'Payables',equity:'Equity',income:'Income',expense:'Expenses'};
let S,r='home',q='',flt='all',tab='lines',jl=[{},{}];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const T=()=>new Date().toISOString().slice(0,10);
const D=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const money=n=>CUR+' '+fmt(n);
function save(){try{localStorage.setItem('acct2',JSON.stringify(S))}catch(e){}}
function totals(i){let u=0,t=0;i.lines.forEach(l=>{const s=(+l.qty||0)*(+l.price||0);u+=s;t+=s*(+l.tax||0)});return{u,t,tot:u+t}}
function je(date,ref,jr,memo,lines){S.entries.push({date,ref,jr,memo,lines:lines.filter(l=>l.debit||l.credit)})}
function mk(t,partner,date,due,lines){const i={id:S.nid++,type:t,partner,date,due,lines,state:'draft',paid:false,num:''};S.invoices.push(i);return i}
function confirmInv(i){
 const{u,t,tot}=totals(i);S.seq[i.type]++;
 if(!i.num)i.num=(i.type==='out'?'INV/':'BILL/')+i.date.slice(0,4)+'/'+String(S.seq[i.type]).padStart(4,'0');
 i.state='posted';
 if(i.type==='out')je(i.date,i.num,'INV','Customer Invoice',[{acc:'1200',debit:tot,credit:0},{acc:'4000',debit:0,credit:u},{acc:'2200',debit:0,credit:t}]);
 else je(i.date,i.num,'BILL','Vendor Bill',[{acc:'5000',debit:u,credit:0},{acc:'1400',debit:t,credit:0},{acc:'2100',debit:0,credit:tot}]);
}
function payInv(i){const tot=totals(i).tot;i.paid=true;i.paidOn=T();
 if(i.type==='out')je(T(),'PAY/'+i.num,'BNK','Payment from '+i.partner,[{acc:'1000',debit:tot,credit:0},{acc:'1200',debit:0,credit:tot}]);
 else je(T(),'PAY/'+i.num,'BNK','Payment to '+i.partner,[{acc:'2100',debit:tot,credit:0},{acc:'1000',debit:0,credit:tot}]);}
function init(){
 try{S=JSON.parse(localStorage.getItem('acct2'))}catch(e){S=null}
 if(S){if(!S.recs)seedRecs();return}
 S={nid:1,seq:{out:0,in:0},entries:[],invoices:[],accounts:[['1000','Bank','asset'],['1200','Accounts Receivable','asset'],['1400','Tax Receivable','asset'],['2100','Accounts Payable','liability'],['2200','Tax Payable','liability'],['3000','Capital','equity'],['4000','Product Sales','income'],['5000','Expenses','expense'],['5100','Cost of Goods Sold','expense']].map(a=>({code:a[0],name:a[1],type:a[2]}))};
 je(D(-60),'OPEN','MISC','Opening balance',[{acc:'1000',debit:80000,credit:0},{acc:'3000',debit:0,credit:80000}]);
 const L=(d,p,q_)=>[{desc:d,qty:q_,price:p,tax:0.15}];
 let i=mk('out','Azure Interior',D(-40),D(-10),L('Office design',3,2500));confirmInv(i);payInv(i);
 i=mk('out','Deco Addict',D(-25),D(-5),L('Consulting hours',20,350));confirmInv(i);
 i=mk('out','Gemini Furniture',D(-6),D(24),L('Annual support plan',1,9000));confirmInv(i);
 i=mk('out','Lumber Inc',D(-1),D(29),L('Implementation',5,1200));
 i=mk('in','Wood Corner',D(-30),D(-2),L('Material supplies',10,420));confirmInv(i);
 i=mk('in','Cloud Hosting Ltd',D(-3),D(27),L('Server hosting',1,1750));confirmInv(i);
 seedRecs();save();
}
const A=c=>S.accounts.find(a=>a.code===c);
function bal(c){let d=0,k=0;S.entries.forEach(e=>e.lines.forEach(l=>{if(l.acc===c){d+=+l.debit||0;k+=+l.credit||0}}));return d-k}
const net=a=>{const b=bal(a.code);return(a.type==='asset'||a.type==='expense')?b:-b};
const sum=t=>S.accounts.filter(a=>a.type===t).reduce((s,a)=>s+net(a),0);
const accName=c=>A(c)?c+' '+A(c).name:c;
 
function go(x,f){r=x;if(f!==undefined)flt=f;q='';tab='lines';window.scrollTo(0,0);render()}
function renderAcc(){
 $('nav').innerHTML=`<div class="brand" style="cursor:pointer" onclick="go('home')" title="Home menu"><i>▦</i><span>Accounting</span></div><div class="dd"><a style="display:block;line-height:46px;padding:0 12px;cursor:pointer;color:#fff" onclick="go('dash')">Dashboard</a></div>`+
 MENU.map(m=>`<div class="dd"><button>${m[0]}</button><div class="dm">${m[1].map(x=>`<a onclick="go('${x[1]}')">${x[0]}</a>`).join('')}</div></div>`).join('')+`<div class="av">A</div>`;
 const[v,id]=r.split(':');
 ({dash,'list-out':()=>list('out'),'list-in':()=>list('in'),inv,je:jeView,jenew,coa,tb:()=>rep('tb'),pl:()=>rep('pl'),bs:()=>rep('bs')})[v](id);
}
function cp(crumbs,right,mid){
 $('cp').innerHTML=`<div class="cp"><div class="bc">${crumbs.map((c,i)=>i<crumbs.length-1?`<a onclick="go('${c[1]}')">${c[0]}</a><span>/</span>`:`<b style="font-weight:500">${c[0]}</b>`).join('')}</div>${right||''}${mid||''}</div>`;
}
const unpaid=t=>S.invoices.filter(i=>i.type===t&&i.state==='posted'&&!i.paid);
const sumT=a=>a.reduce((s,i)=>s+totals(i).tot,0);
function dcard(t,title,sub,btn){
 const dr=S.invoices.filter(i=>i.type===t&&i.state==='draft'),up=unpaid(t),late=up.filter(i=>i.due<T()),week=up.filter(i=>i.due>=T()&&i.due<=D(7)),nd=up.filter(i=>i.due>D(7));
 const vals=[sumT(late),sumT(week),sumT(nd)],mx=Math.max(...vals,1);
 return `<div class="card"><div class="ch"><b>${title}</b><small>${sub}</small></div><div class="cb"><div class="lk"><button class="btn" onclick="newInv('${t}')">${btn}</button>
 <div style="height:6px"></div><a onclick="go('list-${t}','draft')"><span>${dr.length} To Validate</span><span>${fmt(sumT(dr))}</span></a>
 <a onclick="go('list-${t}','unpaid')"><span>${up.length} Waiting Payment</span><span>${fmt(sumT(up))}</span></a>
 <a onclick="go('list-${t}','late')"><span>${late.length} Late</span><span>${fmt(sumT(late))}</span></a></div>
 <div class="bars">${['Late','Due','Not due'].map((n,k)=>`<div><i class="${k?'':'l'}" style="height:${Math.max(vals[k]/mx*54,3)}px" title="${fmt(vals[k])}"></i>${n}</div>`).join('')}</div></div></div>`;
}
function dash(){
 cp([['Dashboard','dash']]);
 const rev=sum('income'),ex=sum('expense'),bank=net(A('1000')),misc=S.entries.filter(e=>e.jr==='MISC').length,bnk=S.entries.filter(e=>e.jr==='BNK').length;
 $('main').innerHTML=`<main><div class="grid">${dcard('out','Customer Invoices','Sales','New Invoice')}${dcard('in','Vendor Bills','Purchases','New Bill')}
 <div class="card"><div class="ch"><b>Bank</b><small>${CUR}</small></div><div class="cb"><div class="lk"><button class="btn" onclick="go('jenew')">New Transaction</button><div style="height:6px"></div><a onclick="go('je')"><span>${bnk} Bank entries</span></a></div><div style="text-align:right"><div style="color:var(--muted)">Balance</div><div class="big">${fmt(bank)}</div></div></div></div>
 <div class="card"><div class="ch"><b>Miscellaneous Operations</b><small>General</small></div><div class="cb"><div class="lk"><button class="btn" onclick="go('jenew')">New Entry</button><div style="height:6px"></div><a onclick="go('je')"><span>${misc} Journal entries</span></a></div></div></div></div>
 <div class="sec">Profit &amp; Loss</div><div class="grid">
 <div class="card"><div class="cb"><div><div style="color:var(--muted)">Income</div><div class="big pos">${money(rev)}</div></div></div></div>
 <div class="card"><div class="cb"><div><div style="color:var(--muted)">Expenses</div><div class="big neg">${money(ex)}</div></div></div></div>
 <div class="card" style="cursor:pointer" onclick="go('pl')"><div class="cb"><div><div style="color:var(--muted)">Net Profit</div><div class="big">${money(rev-ex)}</div></div></div></div></div></main>`;
}
function matches(i){
 const s=q.toLowerCase(),late=i.state==='posted'&&!i.paid&&i.due<T();
 if(s&&!(i.num+' '+i.partner).toLowerCase().includes(s))return false;
 return {all:1,draft:i.state==='draft',posted:i.state==='posted',unpaid:i.state==='posted'&&!i.paid,late,paid:i.paid}[flt];
}
const badge=i=>i.state==='draft'?'<span class="bd d">Draft</span>':i.paid?'<span class="bd g">Paid</span>':'<span class="bd p">Not Paid</span>';
function rows(t){
 const L=S.invoices.filter(i=>i.type===t&&matches(i)).sort((a,b)=>b.id-a.id);
 if(!L.length)return `<tr><td colspan="7" class="empty">No records match. Create a new one to get started.</td></tr>`;
 return L.map(i=>{const x=totals(i);return `<tr class="row" onclick="go('inv:${i.id}')"><td>${i.num||'Draft'}</td><td>${esc(i.partner)||'—'}</td><td>${i.date}</td><td class="${i.state==='posted'&&!i.paid&&i.due<T()?'late':''}">${i.due}</td><td class="n">${fmt(x.u)}</td><td class="n">${fmt(x.tot)}</td><td>${badge(i)}</td></tr>`}).join('')+
 `<tr class="t"><td colspan="4"></td><td class="n">${fmt(L.reduce((s,i)=>s+totals(i).u,0))}</td><td class="n">${fmt(L.reduce((s,i)=>s+totals(i).tot,0))}</td><td></td></tr>`;
}
function list(t){
 const nm=t==='out'?'Invoices':'Bills',F=[['all','All'],['draft','Draft'],['posted','Posted'],['unpaid','Not Paid'],['late','Late'],['paid','Paid']];
 cp([[nm,'list-'+t]],`<button class="btn" onclick="newInv('${t}')">New</button>`,`<div class="search"><input placeholder="Search ${nm}…" value="${esc(q)}" oninput="q=this.value;$('tb').innerHTML=rows('${t}')"><select onchange="flt=this.value;$('tb').innerHTML=rows('${t}')">${F.map(f=>`<option value="${f[0]}" ${flt===f[0]?'selected':''}>${f[1]}</option>`).join('')}</select></div>`);
 $('main').innerHTML=`<main><div class="sheet"><table><thead><tr><th>Number</th><th>${t==='out'?'Customer':'Vendor'}</th><th>${t==='out'?'Invoice':'Bill'} Date</th><th>Due Date</th><th class="n">Tax Excluded</th><th class="n">Total</th><th>Status</th></tr></thead><tbody id="tb">${rows(t)}</tbody></table></div></main>`;
}
function newInv(t){const i=mk(t,'',T(),D(30),[{desc:'',qty:1,price:0,tax:0.15}]);save();go('inv:'+i.id)}
const cur=()=>S.invoices.find(i=>i.id==r.split(':')[1]);
function refreshT(i){const x=totals(i);i.lines.forEach((l,k)=>{const e=$('s'+k);if(e)e.textContent=fmt((+l.qty||0)*(+l.price||0))});
 $('tt').innerHTML=`<div><span>Untaxed Amount</span><span>${fmt(x.u)}</span></div><div><span>VAT</span><span>${fmt(x.t)}</span></div><div class="g"><span>Total</span><span>${money(x.tot)}</span></div>`;save()}
function setF(f,v){const i=cur();i[f]=v;save()}
function setL(k,f,v){const i=cur();i.lines[k][f]=f==='desc'?v:+v;refreshT(i)}
function addL(){cur().lines.push({desc:'',qty:1,price:0,tax:0.15});render()}
function delL(k){const i=cur();if(i.lines.length>1)i.lines.splice(k,1);save();render()}
function act(a){const i=cur();
 if(a==='ok'){if(!i.partner.trim()||totals(i).tot<=0){alert('Add a '+(i.type==='out'?'customer':'vendor')+' and at least one line with an amount.');return}confirmInv(i)}
 if(a==='pay')payInv(i);
 if(a==='draft'){S.entries=S.entries.filter(e=>e.ref!==i.num);i.state='draft'}
 if(a==='del'){if(!confirm('Delete this draft?'))return;S.invoices=S.invoices.filter(x=>x!==i);save();go('list-'+i.type);return}
 save();render();
}
function inv(){
 const i=cur();if(!i){go('dash');return}
 const ro=i.state==='posted',nm=i.type==='out'?'Invoice':'Bill',x=totals(i);
 cp([[nm+'s','list-'+i.type],[i.num||'New']]);
